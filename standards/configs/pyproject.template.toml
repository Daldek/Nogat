# Szablon pyproject.toml
# Źródło: shared/standards/DEVELOPMENT_STANDARDS.md, sekcja 8
# Użycie: skopiuj do korzenia nowego projektu, zamień placeholdery [NAZWA], [OPIS] itd.
# Wszystkie narzędzia konfigurowane tutaj — nie tworzyć osobnych plików (setup.cfg, tox.ini, .flake8)

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "[NAZWA]"
version = "0.1.0"
description = "[OPIS]"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "[AUTOR]", email = "[EMAIL]"},
]
dependencies = [
  # Zależności produkcyjne — dodaj według potrzeb projektu
  # "numpy>=2.0",
  # "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

# Odkomentuj jeśli projekt ma CLI
# [project.scripts]
# [NAZWA] = "[NAZWA].cli:main"

# --- Ruff (linter + formatter) ---

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort, UP = pyupgrade,
# B = bugbear (typowe błędy), SIM = simplify (uproszczenia kodu)
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# --- mypy (statyczna analiza typów) ---

[tool.mypy]
python_version = "3.12"
strict = true
# Ignoruj brakujące typy w zewnętrznych bibliotekach bez stubów
warn_return_any = true
warn_unused_configs = true

# --- coverage (pokrycie testami) ---

[tool.coverage.run]
# Mierz pokrycie tylko dla kodu projektu, nie testów
source = ["[NAZWA]"]
omit = ["tests/*"]

[tool.coverage.report]
# Progi pokrycia: 80% dla kodu produkcyjnego, 60% akceptowalne na starcie
fail_under = 60
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__",
]
