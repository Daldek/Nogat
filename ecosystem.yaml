# Ecosystem registry (HUB §2, ECO-002): projects, dependencies and data exchanged
# between them. Structure only; versions and pins are read from the repositories:
# `uv run scripts/ecosystem.py drift`.
# Validate and regenerate docs/ECOSYSTEM_MAP.md: `uv run scripts/ecosystem.py map`.

schema: nogat-ecosystem/1
standard_version: "2.1"

data_sources:
  - id: gugik
    name: GUGiK (Główny Urząd Geodezji i Kartografii)
    country: PL
    url: https://www.geoportal.gov.pl
    licence: free reuse with attribution (Prawo geodezyjne i kartograficzne)
  - id: cuzk
    name: ČÚZK (Český úřad zeměměřický a katastrální)
    country: CZ
    url: https://geoportal.cuzk.cz
    licence: CC BY 4.0
  - id: clms
    name: Copernicus Land Monitoring Service (CORINE Land Cover)
    country: EU
    url: https://land.copernicus.eu
    licence: Copernicus data policy, attribution required
  - id: soilgrids
    name: ISRIC SoilGrids
    country: global
    url: https://soilgrids.org
    licence: CC BY 4.0
  - id: imgw-pib
    name: IMGW-PIB (archives, live API, PMAXTP atlas)
    country: PL
    url: https://danepubliczne.imgw.pl
    licence: IMGW-PIB terms of reuse, attribution required
  - id: chmi
    name: ČHMÚ open data
    country: CZ
    url: https://opendata.chmi.cz
    licence: CC BY 4.0
  - id: osm
    name: OpenStreetMap
    country: global
    url: https://www.openstreetmap.org
    licence: ODbL

projects:
  - name: Nogat
    summary: Ecosystem hub with standards, registry and map; future user package installing all tools.
    profiles: [hub]
    status: active
    repo: https://github.com/Daldek/Nogat
    visibility: public
    distribution: {pypi: null, import_name: null}
    interfaces: {cli: null, mcp: null, rest: null, python: null}
    data_sources: []
    provides: []
    depends_on: []

  - name: Kartograf
    summary: Downloads Polish and Czech geodata (DEM, imagery, land cover, soil) as plain files or a store.
    profiles: [tool]
    status: active
    repo: https://github.com/Daldek/Kartograf
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: null, import_name: kartograf}
    interfaces:
      cli: kartograf
      mcp: kartograf-mcp
      rest: null
      python: kartograf
    data_sources: [gugik, cuzk, clms, soilgrids]
    provides:
      - id: kartograf-files
        kind: dataset
        summary: Downloaded rasters and vectors (ASC/GeoTIFF DEM, GeoPackage BDOT10k, SoilGrids and HSG GeoTIFF, LAZ), as plain files under their store names (--output-dir, DEV-19.5) or as store versions.
      - id: kartograf-meta/1
        kind: sidecar
        summary: "<file>.meta.json next to every stored file, none in plain mode: CRS, nodata, source, licence, request, parent_request, SHA-256, producer, producer_version."
      - id: kartograf-store/1
        kind: store
        summary: Versioned store (versions/<label>_<sha8>/, hard-linked current path) with root marker kartograf-store.json (schema kartograf-store/1, DEV-19.12), default root <data_dir>/kartograf, kartograf store init, and read API list_segments, iter_store, read_sidecar, file_footprint (keyword root).
      - id: kartograf-project/1
        kind: manifest
        summary: kartograf-project.json pinning store versions by SHA-256, with the store root.
      - id: kartograf-download/1
        kind: document
        summary: "Download report: files[] {path, size_bytes, sha256, status}, failed[], skipped[], notices, mode plain or store; also for land cover, soil, HSG and collections."
      - id: kartograf-plan/1
        kind: document
        summary: Plan without effects (--check) per file; current, newer, missing or unverifiable in the store, write, replace or conflict in plain mode.
      - id: kartograf-availability/1
        kind: document
        summary: Years, systems, resolutions and completeness of DEM coverage for an area.
      - id: kartograf-command-list/1
        kind: catalog
        summary: Summary of every command (name, operation_id, effects, check twin) from list_commands and kartograf commands list; the first step of discovery.
      - id: kartograf-commands/1
        kind: catalog
        summary: One command with options, rules, errors and examples (command_schema, kartograf commands schema) behind CLI and MCP, with validate_command, run_command, check_command, format_command.
      - id: kartograf-result/1
        kind: document
        summary: Result envelope of every command (status ok, partial or failed, domain result, items, notices); exit codes 0, 10 and 11.
      - id: kartograf-error/1
        kind: document
        summary: Error document with code, hint and exit code, the last line of stderr.
      - id: kartograf-testing
        kind: library
        summary: kartograf.testing builds stores, projects and sidecars with the real writers, offline, for the contract tests of consumers (DEV-10.6).
    depends_on: []

  - name: IMGWTools
    summary: IMGW-PIB and ČHMÚ hydro-meteo data, PMAXTP; plain files or a versioned store with Parquet series.
    profiles: [tool, app]
    status: active
    repo: https://github.com/Daldek/IMGWTools
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: imgwtools, import_name: imgwtools}
    interfaces:
      cli: imgw
      mcp: imgw mcp
      rest: imgw server (/api/v1)
      python: imgwtools
    data_sources: [imgw-pib, chmi]
    provides:
      - id: imgw-store/1
        kind: store
        summary: Versioned store (archives, stations, series) with root marker imgw-store.json (tool, created_at, producer_version, DEV-19.12), default root <data_dir>/imgw (IMGW_ROOT), imgw store init, and read API store_info, iter_store, read_meta, read_series.
      - id: imgw-meta/1
        kind: sidecar
        summary: Archive sidecar with dataset, provider, licence, HTTP signals, SHA-256 and content_sha256.
      - id: imgw-series/1
        kind: dataset
        summary: Parquet series per station with series.json index (periods, year type, units, coverage).
      - id: imgw-project/1
        kind: manifest
        summary: imgw-project.json pinning store versions by SHA-256 or content hash.
      - id: imgw-plan/1
        kind: document
        summary: Plan without effects (--check) for archives, series and catalog in the store, and write, replace or conflict per file in plain mode.
      - id: imgw-observation/1
        kind: document
        summary: History of published HTTP signals per archive file.
      - id: chmi-json/1
        kind: document
        summary: Canonical JSON form of ČHMÚ files used for content-based pins.
      - id: imgw-result/1
        kind: document
        summary: "Result envelope of every command (status, result, errors, notices, exit code); a writing command lists files[] {path, size_bytes, sha256, status}."
      - id: imgw-command-list/1
        kind: catalog
        summary: Summary of every command (name, operation_id, group, effects, check twin, REST route) from list_commands and imgw commands list.
      - id: imgw-commands/1
        kind: catalog
        summary: One command with options, x-imgw metadata and errors (command_schema, imgw commands schema) behind CLI, REST and MCP, with validate_command, run_command, check_command, format_command.
      - id: imgw-archives
        kind: dataset
        summary: IMGW-PIB and ČHMÚ archive files as published (ZIP, CSV, JSON), as plain files under their server path (datasets download --output-dir) or as store versions.
      - id: imgw-series-csv
        kind: dataset
        summary: CSV export of series with units and IMGW-PIB attribution (series export --output FILE).
      - id: imgw-pmaxtp
        kind: document
        summary: PMAXTP design precipitation quantiles per grid cell (fetch_pmaxtp, PMaXTPResult).
      - id: imgw-testing
        kind: library
        summary: imgwtools.testing builds an offline store (archives, series, catalog) with the real writers and the marker, for the contract tests and probes of consumers (DEV-10.6).
    depends_on:
      - project: Kartograf
        kind: data
        status: active
        via: [store]
        exchange: [kartograf-store/1]
        note: No import; refuses a store nested in another, and a plain output directory inside one, by marker file name (DEV-19.11, DEV-19.12, DEV-19.14), as Kartograf does with imgw-store.json. Hard-link publication model follows Kartograf ADR-036.

  - name: Hydrolog
    summary: Hydrological calculations (tc, SCS-CN, hydrographs, routing, statistics, HSG); library, CLI, MCP.
    profiles: [tool]
    status: active
    repo: https://github.com/Daldek/Hydrolog
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: null, import_name: hydrolog}
    interfaces:
      cli: hydrolog
      mcp: hydrolog mcp
      rest: null
      python: hydrolog
    data_sources: []
    provides:
      - id: watershed-parameters
        kind: document
        summary: WatershedParameters JSON (area, perimeter, length, elevations, CN, slopes) as calculation input.
      - id: hydrolog-hsg
        kind: dataset
        summary: HSG raster (uint8 GeoTIFF, groups A–D) and HSG statistics from clay, sand and silt rasters.
      - id: hydrolog-hydrograph-csv
        kind: dataset
        summary: Hydrograph table, a CSV with time_min and discharge_m3s at a regular step; every route command reads it and writes it with --output, route network writes one <id>.csv per node with --output-dir; the hand-off to hydraulic models.
      - id: hydrolog-network/1
        kind: document
        summary: River-network document of route network (nodes subcatchment, reach, reservoir, junction and outlet, with the options of their method), with its JSON Schema shipped in the package.
      - id: hydrolog-result/1
        kind: document
        summary: Result envelope (command, inputs, result, files with SHA-256, notices).
      - id: hydrolog-error/1
        kind: document
        summary: Error envelope with registry code, details and hint.
      - id: hydrolog-command-list/1
        kind: catalog
        summary: Summary of every command from list_commands and hydrolog commands list (paged); the first step of discovery.
      - id: hydrolog-commands/1
        kind: catalog
        summary: One command with options, effects, errors and examples (command_schema, hydrolog commands schema) behind CLI, MCP and hydrolog.operations, with validate_command, check_command, run_command.
      - id: hydrolog-python-api
        kind: library
        summary: Calculation classes (ConcentrationTime, HydrographGenerator, NashIUH, the four hietograms) and routing (Hydrograph, the reach classes, RoutingNetwork).
    depends_on:
      - project: IMGWTools
        kind: data
        status: active
        via: [file]
        exchange: [imgw-series-csv]
        note: No package dependency; stats commands read series CSV exported by `imgw series export --output FILE`.
      - project: Kartograf
        kind: data
        status: active
        via: [file]
        exchange: [kartograf-files]
        note: No package dependency; `soil hsg` reads SoilGrids clay, sand and silt GeoTIFFs, plain files of `kartograf soil download --output-dir` (`files[].path`). HSG rules ported from Kartograf (Hydrolog ADR-025).

  - name: Hydrograf
    summary: Web app (FastAPI + PostGIS) for watershed delineation and design hydrographs.
    profiles: [app]
    status: active
    repo: https://github.com/Daldek/Hydrograf
    python_manifests: [backend/pyproject.toml, backend/requirements.txt]
    visibility: public
    distribution: {pypi: null, import_name: null}
    interfaces: {cli: null, mcp: null, rest: /api, python: null}
    data_sources: [gugik, osm]
    provides:
      - id: hydrograf-rest
        kind: service
        summary: REST API with watershed boundary GeoJSON, morphometry JSON, hydrograph Q(t) and CSV exports; MVT tiles.
    depends_on:
      - project: Kartograf
        kind: runtime
        status: active
        via: [library]
        exchange: [kartograf-files, kartograf-meta/1]
        uses: [DownloadManager, GugikProvider, MetadataCache, LandCoverManager, Bdot10kProvider, HSGCalculator, SheetParser, find_sheets_for_bbox, find_sheets_for_geometry]
      - project: Hydrolog
        kind: runtime
        status: active
        via: [library]
        exchange: [watershed-parameters, hydrolog-python-api]
        uses: [WatershedParameters, ConcentrationTime, HydrographGenerator, NashIUH, BetaHietogram, BlockHietogram, EulerIIHietogram]
      - project: IMGWTools
        kind: runtime
        status: active
        via: [library]
        exchange: [imgw-pmaxtp]
        uses: [fetch_pmaxtp]
      - project: Hydraulik
        kind: runtime
        status: planned
        via: [service]
        exchange: [hydraulik-job]
        note: Hydraulik as an external compute node fed with a catchment domain.

  - name: Hydraulik
    summary: Builds and runs SFINCS flood models from terrain and design rain; optional EPA SWMM sewer coupling.
    profiles: [tool]
    status: research
    repo: https://github.com/Daldek/Hydraulik
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: null, import_name: hydraulik}
    interfaces: {cli: hydraulik, mcp: null, rest: null, python: hydraulik}
    data_sources: []
    provides:
      - id: hydraulik-job
        kind: contract
        summary: Planned hydraulik.spec contracts (JobSpec, InputBundle, RunStatus, ResultManifest) and web products.
    depends_on:
      - project: Kartograf
        kind: optional
        status: active
        via: [cli]
        exchange: [kartograf-files, kartograf-commands/1, kartograf-result/1, kartograf-download/1, kartograf-plan/1, kartograf-error/1]
        uses: [elevation download, landcover download, soil hsg, commands schema]
        note: Starts the kartograf program and never imports it. terrain download plans every product with --check, then fetches into one sub-directory of --output-dir per product (DEV-19.5, DEV-19.6); the options come from commands schema, and a Kartograf whose output_dir is not path_role output is refused. A model built from the user's own rasters needs none of it.
      - project: IMGWTools
        kind: optional
        status: active
        via: [library, file]
        exchange: [imgw-pmaxtp, imgw-result/1]
        uses: [fetch_pmaxtp]
        note: rainfall build takes the PMAXTP depth from fetch_pmaxtp (extra rainfall) or from the document that imgw pmaxtp fetch --json prints.
      - project: Hydrolog
        kind: optional
        status: active
        via: [library, file]
        exchange: [hydrolog-python-api, hydrolog-result/1, hydrolog-hydrograph-csv]
        uses: [BlockHietogram, TriangularHietogram, BetaHietogram, EulerIIHietogram]
        note: rainfall build takes the hyetograph shape from the classes (extra rainfall) or from the document that hydrolog precip hietogram --json prints; swmm run --inflow and model couple --inflow read the tables <id>.csv of hydrolog route network --output-dir as the inflow of one node (ADR-0009).

  - name: Retman
    summary: Polish natural-language command layer over the ecosystem tools.
    profiles: [tool]
    status: active
    repo: https://github.com/Daldek/Retman
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: null, import_name: retman}
    interfaces: {cli: retman, mcp: null, rest: null, python: retman}
    data_sources: []
    provides: []
    depends_on:
      - project: Kartograf
        kind: optional
        status: active
        via: [library]
        exchange: [kartograf-command-list/1, kartograf-commands/1, kartograf-result/1, kartograf-download/1, kartograf-error/1, kartograf-meta/1]
      - project: IMGWTools
        kind: optional
        status: active
        via: [library]
        exchange: [imgw-command-list/1, imgw-commands/1, imgw-result/1, imgw-plan/1, imgw-project/1, imgw-store/1, imgw-archives, imgw-series-csv, imgw-testing]
      - project: Hydrolog
        kind: optional
        status: planned
        via: [library]
        exchange: [hydrolog-command-list/1, hydrolog-commands/1, hydrolog-result/1]
        note: Retman PRD roadmap.
      - project: Hydrograf
        kind: optional
        status: planned
        via: [rest]
        exchange: [hydrograf-rest]
        note: Retman PRD roadmap.

  - name: Archiwista
    summary: Web browser and manager of Kartograf and IMGWTools stores.
    profiles: [app]
    status: active
    repo: https://github.com/Daldek/Archiwista
    python_manifests: [pyproject.toml]
    visibility: public
    distribution: {pypi: null, import_name: archiwista}
    interfaces: {cli: archiwista, mcp: null, rest: /api/v1, python: null}
    data_sources: [gugik, osm]
    provides:
      - id: archiwista-rest
        kind: service
        summary: REST API /api/v1 (catalog, map footprints, projects, previews, jobs with SSE).
      - id: archiwista-sources
        kind: contract
        summary: Source adapter protocol registered through the archiwista.sources entry point.
    depends_on:
      - project: Kartograf
        kind: runtime
        status: active
        via: [library, store]
        exchange: [kartograf-store/1, kartograf-meta/1, kartograf-project/1, kartograf-plan/1]
        uses: [list_segments, list_partitions, iter_store, read_sidecar, describe_segment, file_footprint, link_target, pinned_transform, open_project, get_project_status]
        note: Contract KA-1..KA-8 (Archiwista SPEC §12); KB..KG planned.
      - project: IMGWTools
        kind: optional
        status: planned
        via: [library, store]
        exchange: [imgw-store/1, imgw-meta/1, imgw-series/1, imgw-project/1, imgw-observation/1, chmi-json/1]
        note: Extra archiwista[imgw] (IMGW-1..14); ČHMÚ (IMGW-15..19).
