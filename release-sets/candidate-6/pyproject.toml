# Release set candidate-6 (REL-6.4): what `nogat` would install, verified by
# the workflow verify-candidate (REL-6.5). Each installable member at its
# commit of members.toml (`set bump` moves the `rev` below), with the extras its
# gate installs (`--all-extras`); the `dev` group is the union of the members'
# `dev` groups, verbatim. Hydrograf, an app without a package, is not installed
# (REL-6.1, ECO-074): verify-candidate runs it on its own lock, which pins the
# set's commits of its producers.
[project]
name = "nogat"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "kartograf[mcp]",
    "obserwator[full]",
    "hydrolog[all]",
    "archiwista[obserwator]",
]

[dependency-groups]
dev = [
    # Kartograf
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    # Obserwator
    "jsonschema>=4.18",
    "mypy>=1.19",
    "pandas-stubs>=2.0",
    "playwright>=1.64,<2",
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6",
    "respx>=0.20",
    "ruff>=0.15",
    # Hydrolog
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    "httpx2>=2.16,<3",
    "playwright>=1.64,<2",
    # Archiwista
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "jsonschema>=4.18,<5",
    "trustme>=1.2,<2",
]

[tool.uv]
# No `nogat` package yet (HUB §7): the set is installed, not built.
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
kartograf = { git = "https://github.com/Daldek/Kartograf", rev = "7a1eb119e92f788de94711d50695c7d37991f421" }
obserwator = { git = "https://github.com/Daldek/Obserwator", rev = "11eedea833d40e64063d30a8fd7df606cb0db746" }
hydrolog = { git = "https://github.com/Daldek/Hydrolog", rev = "1be867d8ecce49f3336777ced51090e6f5bcb359" }
archiwista = { git = "https://github.com/Daldek/Archiwista", rev = "95b0540b75953c0ea65be73ad7ba61d0056e77fb" }
