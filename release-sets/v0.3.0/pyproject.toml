# Release set v0.3.0 (REL-6.6, HUB-7.2): candidate-15 with each member's
# commit replaced by its release tag. Each installable member at its exact
# version, with the extras its gate installs (`--all-extras`); the `dev` group
# is the union of the members' `dev` groups, verbatim. Hydrograf, an app
# without a package, is not installed (REL-6.1, ECO-074): it is released by
# its own tag, v0.6.1, at these tags of its producers.
[project]
name = "nogat"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "kartograf[mcp]==0.9.0",
    "obserwator[full]==3.2.1",
    "hydrolog[all]==0.9.1",
    "archiwista[obserwator]==0.4.1",
]

[dependency-groups]
dev = [
    # Kartograf
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    # Obserwator
    "jsonschema>=4.18",
    "mypy>=1.19",
    "pandas-stubs>=2.0",
    "playwright>=1.64,<2",
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6",
    "respx>=0.20",
    "ruff>=0.15",
    # Hydrolog
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    "httpx2>=2.16,<3",
    "playwright>=1.64,<2",
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    # Archiwista
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "jsonschema>=4.18,<5",
    "trustme>=1.2,<2",
]

[tool.uv]
# No `nogat` package yet (HUB §7): the set is installed, not built.
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
# Hydrolog pins Obserwator as `tag = "v3.2.1"` on `Obserwator.git`, Archiwista
# as `git+…/Obserwator@v3.2.1`, and uv refuses the two forms of one tag as
# conflicting URLs; Archiwista pins Kartograf as `git+…/Kartograf@v0.9.0`,
# which uv would otherwise lock as Kartograf's source. The overrides name each
# shared producer once, at its tag, with the extras of `dependencies` (the
# same third-party versions as candidate-15's lock).
override-dependencies = [
    "kartograf[mcp] @ git+https://github.com/Daldek/Kartograf@v0.9.0",
    "obserwator[full] @ git+https://github.com/Daldek/Obserwator@v3.2.1",
]

[tool.uv.sources]
kartograf = { git = "https://github.com/Daldek/Kartograf", rev = "v0.9.0" }
obserwator = { git = "https://github.com/Daldek/Obserwator", rev = "v3.2.1" }
hydrolog = { git = "https://github.com/Daldek/Hydrolog", rev = "v0.9.1" }
archiwista = { git = "https://github.com/Daldek/Archiwista", rev = "v0.4.1" }
