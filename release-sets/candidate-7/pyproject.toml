# Release set candidate-6 (REL-6.4): what `nogat` would install, verified by
# the workflow verify-candidate (REL-6.5). Each installable member at its
# commit of members.toml (`set bump` moves the `rev` below), with the extras its
# gate installs (`--all-extras`); the `dev` group is the union of the members'
# `dev` groups, verbatim. Hydrograf, an app without a package, is not installed
# (REL-6.1, ECO-074): verify-candidate runs it on its own lock, which pins the
# set's commits of its producers.
[project]
name = "nogat"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "kartograf[mcp]",
    "obserwator[full]",
    "hydrolog[all]",
    "archiwista[obserwator]",
]

[dependency-groups]
dev = [
    # Kartograf
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    # Obserwator
    "jsonschema>=4.18",
    "mypy>=1.19",
    "pandas-stubs>=2.0",
    "playwright>=1.64,<2",
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6",
    "respx>=0.20",
    "ruff>=0.15",
    # Hydrolog
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    "httpx2>=2.16,<3",
    "playwright>=1.64,<2",
    # Archiwista
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "jsonschema>=4.18,<5",
    "trustme>=1.2,<2",
]

[tool.uv]
# No `nogat` package yet (HUB §7): the set is installed, not built.
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
kartograf = { git = "https://github.com/Daldek/Kartograf", rev = "723d430f29a649a6cf8850ff1d7b3bedd9743097" }
obserwator = { git = "https://github.com/Daldek/Obserwator", rev = "f3b42e051dc52e35bf5c82f2a0e310ac279306d5" }
hydrolog = { git = "https://github.com/Daldek/Hydrolog", rev = "c7d731a5a51defe3d99f1f804fbfa1673635701b" }
archiwista = { git = "https://github.com/Daldek/Archiwista", rev = "631329284511fe8bf8cccf2b3697093990603ad4" }
