# Release set candidate-8 (REL-6.4): what `nogat` would install, verified by
# the workflow verify-candidate (REL-6.5). Each installable member at its
# commit of members.toml (`set bump` moves the `rev` below), with the extras its
# gate installs (`--all-extras`); the `dev` group is the union of the members'
# `dev` groups, verbatim. Hydrograf, an app without a package, is not installed
# (REL-6.1, ECO-074): verify-candidate runs it on its own lock, which pins the
# set's commits of its producers.
[project]
name = "nogat"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "kartograf[mcp]",
    "obserwator[full]",
    "hydrolog[all]",
    "archiwista[obserwator]",
]

[dependency-groups]
dev = [
    # Kartograf
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    # Obserwator
    "jsonschema>=4.18",
    "mypy>=1.19",
    "pandas-stubs>=2.0",
    "playwright>=1.64,<2",
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6",
    "respx>=0.20",
    "ruff>=0.15",
    # Hydrolog
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.18",
    "httpx2>=2.16,<3",
    "playwright>=1.64,<2",
    # Archiwista
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "jsonschema>=4.18,<5",
    "trustme>=1.2,<2",
]

[tool.uv]
# No `nogat` package yet (HUB §7): the set is installed, not built.
package = false
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
# The producers are released: Hydrolog, Hydrograf and Archiwista pin them by tag
# in two forms (`tag = "v3.0.1"` on `Obserwator.git`, `git+…/Obserwator@v3.0.1`),
# which uv refuses as conflicting URLs; the overrides name each shared producer
# once, at its tag, with the extras of `dependencies` (as in release set v0.1.0).
override-dependencies = [
    "kartograf[mcp] @ git+https://github.com/Daldek/Kartograf@v0.8.1",
    "obserwator[full] @ git+https://github.com/Daldek/Obserwator@v3.0.1",
]

[tool.uv.sources]
kartograf = { git = "https://github.com/Daldek/Kartograf", rev = "9817ab7673be3f5f212e6fbda170e7f4362709f5" }
obserwator = { git = "https://github.com/Daldek/Obserwator", rev = "533c42ab8ce1facacb1b4590f62d2d05c23990d8" }
hydrolog = { git = "https://github.com/Daldek/Hydrolog", rev = "bf35db27edb1dee314944036b4a5e37090d0c06f" }
archiwista = { git = "https://github.com/Daldek/Archiwista", rev = "a8eaea94755e7d931502ab731005fab5fd346a5c" }
